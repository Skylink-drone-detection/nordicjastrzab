CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_LOG=y
# Enable floating point support in printk/printf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Since you are using math.h, ensure the FPU is enabled
CONFIG_FPU=y

# Optional: increase stack size if you notice crashes
CONFIG_MAIN_STACK_SIZE=2048